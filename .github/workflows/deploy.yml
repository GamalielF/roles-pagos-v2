name: Deploy Test

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  test-deploy:
    name: Deploy roles-cop-sanjose
    # El flujo de TI entra a Vault con la identidad de GitHub: necesita id-token, y contents para leer el código
    permissions:
      id-token: write
      contents: read
    uses: COACSanJose/lumen/.github/workflows/deploy-angular.yml@main
    with:
      project_name: roles-cop-sanjose
      base_path: /roles/
      environment: test
    secrets:
      LUMEN_REPO_TOKEN: ${{ secrets.LUMEN_TOKEN }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_TEST }}