name: Deploy Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  production-deploy:
    name: Deploy test
    permissions:
      id-token: write
      contents: read
    uses: COACSanJose/lumen/.github/workflows/deploy-angular.yml@main
    with:
      project_name: roles-cop-sanjose
      base_path: /roles/
      environment: prod
      
    secrets:
      LUMEN_REPO_TOKEN: ${{ secrets.LUMEN_TOKEN }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_PROD }}
