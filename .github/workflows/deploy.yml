name: Deploy Production

# Apagado hasta que exista producción: solo se ejecuta a mano desde Actions (Run workflow).
on:
  workflow_dispatch:

jobs:
  production-deploy:
    name: Deploy roles-cop-sanjose
    uses: COACSanJose/lumen/.github/workflows/deploy-angular.yml@main
    with:
      project_name: roles-cop-sanjose
      base_path: /roles/
      environment: prod
    secrets:
      LUMEN_REPO_TOKEN: ${{ secrets.LUMEN_TOKEN }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_PROD }}
